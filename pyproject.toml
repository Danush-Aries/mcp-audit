[project]
name = "mcp-audit"
version = "0.1.0"
description = "Static security auditor for Claude Code / MCP configuration files. Flags supply-chain, credential, and RCE risk before an agent ever runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhanush Shankar" }]
keywords = ["mcp", "security", "claude", "audit", "supply-chain", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/Danush-Aries/mcp-audit"
Issues = "https://github.com/Danush-Aries/mcp-audit/issues"

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
